<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo flames harness</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f3b77a; font: 13px system-ui, sans-serif; }
      #panel { position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 80vw; }
      #panel button { border: 0; border-radius: 6px; padding: 5px 9px; background: #ffffffcc; cursor: pointer; }
      #panel button.on { background: #ffd35a; }
      #panel label { background: #ffffffcc; border-radius: 6px; padding: 3px 8px; display: flex; gap: 6px; align-items: center; }
      #stats { position: fixed; bottom: 8px; left: 8px; background: #0008; color: #fff; padding: 4px 8px; border-radius: 6px; white-space: pre; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="panel">
      <button id="turbo">Turbo</button>
      <label>amount <input id="amount" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>speed <input id="speed" type="range" min="15" max="44" step="1" value="30" /><span id="speedVal"></span></label>
      <span id="views"></span>
      <span id="qualities"></span>
    </div>
    <div id="stats"></div>
    <script type="module" src="./flames.ts"></script>
  </body>
</html>
