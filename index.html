<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3a75a" />
    <title>Macaw Sky · Tel Aviv</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a12; touch-action: none; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; }
      .game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #boot-loader { position: fixed; inset: 0; display: grid; place-items: center; color: #ffe3b0; font: 600 22px system-ui, sans-serif;
        background: radial-gradient(circle at 50% 70%, #f7a04b 0%, #b24a2a 45%, #2a1a12 100%); text-align: center; }
      #osm-credit { position: fixed; left: 50%; bottom: 2px; transform: translateX(-50%); z-index: 5; font: 10px system-ui, sans-serif; color: rgba(255, 240, 220, 0.6); pointer-events: auto; }
      #osm-credit a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="boot-loader">🦜 טוען… · Loading…</div>
    <div id="app"></div>
    <div id="osm-credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
