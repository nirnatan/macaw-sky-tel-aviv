<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3a75a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Macaw Sky" />
    <meta name="format-detection" content="telephone=no" />
    <title>Macaw Sky · Tel Aviv</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a12; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      body { position: fixed; inset: 0; } /* nothing to scroll, so iOS has nothing to rubber-band */
      #app { position: fixed; inset: 0; overflow: hidden; }
      .game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #boot-loader { position: fixed; inset: 0; display: grid; place-items: center; color: #ffe3b0; font: 600 22px system-ui, sans-serif;
        background: radial-gradient(circle at 50% 70%, #f7a04b 0%, #b24a2a 45%, #2a1a12 100%); text-align: center; }
    </style>
  </head>
  <body>
    <div id="boot-loader">🦜 טוען… · Loading…</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
